[project]
name = "templates-ax-academy-latex"
version = "0.1.0"
description = "Templates de Relatórios AX Academy / IFAM em LaTeX com fontes e saídas padronizadas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
build = "build:cli"
build-pdf = "build:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["build.py"]
